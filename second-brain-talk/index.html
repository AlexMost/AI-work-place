  <body>
    <div class="reveal">
      <div class="slides">
        <!--
          Весь контент живе в slides.md (в корені проєкту).
          Розділювачі:  ---  → новий горизонтальний слайд
                         --  → вертикальний слайд (під поточним)
          Нотатки спікера: рядок, що починається з  Note:
          main.js вставляє вміст slides.md у цей <textarea> до ініціалізації.
        -->
        <section
          data-markdown
          data-separator="\r?\n---\r?\n"
          data-separator-vertical="\r?\n--\r?\n"
          data-separator-notes="^Note:"
        >
          <textarea data-template id="slides-md"></textarea>
        </section>
      </div>
    </div>
  </body>

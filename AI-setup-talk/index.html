<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI basic setup — Harness engineering</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23faf9f6' stroke='%231e1e1e' stroke-width='6'/%3E%3Cpath d='M28 32 L52 50 L28 68' fill='none' stroke='%231971c2' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cline x1='58' y1='68' x2='78' y2='68' stroke='%231971c2' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <!-- Шрифти локальні (Excalifont, Comic Mono) — підключені через @font-face у src/theme.css -->

  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <!--
          Весь контент живе в slides.md (в корені проєкту).
          Розділювачі:  ---  → новий горизонтальний слайд
                         --  → вертикальний слайд (під поточним)
          Нотатки спікера: рядок, що починається з  Note:
          main.js вставляє вміст slides.md у цей <textarea> до ініціалізації.
        -->
        <section
          data-markdown
          data-separator="\r?\n---\r?\n"
          data-separator-vertical="\r?\n--\r?\n"
          data-separator-notes="^Note:"
        >
          <textarea data-template id="slides-md"></textarea>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

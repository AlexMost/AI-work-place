name: pool-auto

on:
  schedule:
    # cron is UTC; Prague is UTC+2 in summer (CEST — the WC window). Matches mostly start
    # 18–19 Prague, so go dense in the evening/night and hourly the rest of the day.
    # GitHub may delay/skip scheduled runs under load — these are best-effort.
    - cron: "*/10 0-2,16-23 * * *"   # every 10 min, 18:00–04:59 Prague — match hours
    - cron: "0 3-15 * * *"           # hourly, 05:00–17:59 Prague — quiet hours
  workflow_dispatch:
    inputs:
      force:
        description: "force full re-render"
        type: boolean
        default: false

permissions:
  contents: write               # needed to push to gh-pages

concurrency:
  group: pool-auto              # never overlap two runs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5          # persist-credentials=true → token in remote

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # gh-pages commits in its own cache clone, so the identity must be global
      - name: Configure git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # whole flow (prev-state gate -> render -> deploy on change) lives in one script,
      # the same one runnable locally via `npm run pool-auto`
      - name: Update pool
        working-directory: footbal
        env:
          POOL_API_TOKEN: ${{ secrets.POOL_API_TOKEN }}
          # gh-pages clones afresh with no creds — push via a token-authenticated URL
          # (GITHUB_TOKEN is auto-masked in logs; permissions: contents: write covers it)
          GH_PAGES_REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          # POOL_ID: ${{ vars.POOL_ID }}   # only if the default pool ever needs overriding
        run: |
          npm run pool-auto -- ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Дві осі SDD — специфікація і процес</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23faf9f6' stroke='%231e1e1e' stroke-width='6'/%3E%3Cline x1='24' y1='76' x2='76' y2='24' stroke='%231971c2' stroke-width='9' stroke-linecap='round'/%3E%3Cline x1='24' y1='24' x2='76' y2='76' stroke='%23e8590c' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <!-- Шрифти локальні (Excalifont, Comic Mono) — підключені через @font-face у src/theme.css -->

    <script type="module" crossorigin src="/AI-work-place/openspec-talk-leads/assets/index-C4D2Tp6U.js"></script>
    <link rel="stylesheet" crossorigin href="/AI-work-place/openspec-talk-leads/assets/index-B9neZGC5.css">
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <!--
          Весь контент живе в slides.md (в корені проєкту).
          Розділювачі:  ---  → новий горизонтальний слайд
                         --  → вертикальний слайд (під поточним)
          Нотатки спікера: рядок, що починається з  Note:
          main.js вставляє вміст slides.md у цей <textarea> до ініціалізації.
        -->
        <section
          data-markdown
          data-separator="\r?\n---\r?\n"
          data-separator-vertical="\r?\n--\r?\n"
          data-separator-notes="^Note:"
        >
          <textarea data-template id="slides-md"></textarea>
        </section>
      </div>
    </div>
  </body>
</html>

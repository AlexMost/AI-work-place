<!DOCTYPE html>
<html lang="uk">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231c0a33'/%3E%3Cpath d='M55 18 L34 56 L48 56 L42 82 L68 42 L53 42 Z' fill='%23b388ff'/%3E%3C/svg%3E"

    <!-- Шрифт Montserrat — локально через @fontsource (імпорт у src/main.js) -->
    <script type="module" crossorigin src="/AI-work-place/from-vibe-to-engineer-talk/assets/index--MOBkq4h.js"></script>
    <link rel="stylesheet" crossorigin href="/AI-work-place/from-vibe-to-engineer-talk/assets/index-DSMWcFzR.css">
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <!--
          Весь контент живе в slides.md (в корені проєкту).
          Розділювачі:  ---  → новий горизонтальний слайд
                         --  → вертикальний слайд (під поточним)
          Нотатки спікера: рядок, що починається з  Note:
          main.js вставляє вміст slides.md у цей <textarea> до ініціалізації.
        -->
        <section
          data-markdown
          data-separator="\r?\n---\r?\n"
          data-separator-vertical="\r?\n--\r?\n"
          data-separator-notes="^Note:"
        >
          <textarea data-template id="slides-md"></textarea>
        </section>
      </div>
    </div>
  </body>
